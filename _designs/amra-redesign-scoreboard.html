
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMRA Assessment - Final Scoreboard</title>
  
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #f4f4f0;
      --surface: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --border: #111111;
      --accent: #0055ff;
      --accent-hover: #0044cc;
      --pass: #008833;
      --pass-bg: #e6f6ec;
      --fail: #d92211;
      --fail-bg: #fae8e6;
      
      --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font-body); display: flex; align-items: center; justify-content: center; height: 100vh; padding: 32px; }
    
    .app-layout {
      width: 100%; max-width: 1440px; height: calc(100vh - 64px);
      display: grid; grid-template-columns: 380px 1fr;
      background: var(--surface); border: 2px solid var(--border); box-shadow: 12px 12px 0px rgba(0,0,0,1);
    }
    
    .sidebar { border-right: 2px solid var(--border); display: flex; flex-direction: column; background: #f9f9f9; }
    .sidebar-header { padding: 40px 32px; border-bottom: 2px solid var(--border); }
    .kicker { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; display: block; }
    .sidebar-header h1 { font-size: 48px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; text-transform: uppercase; margin-bottom: 16px; }
    
    .candidate-info { padding: 32px; flex: 1; display: flex; flex-direction: column; }
    .data-row { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
    .data-label { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; }
    .data-value { font-weight: 600; font-size: 14px; }
    .data-value.mono { font-family: var(--font-mono); }
    
    .score-hero { margin: 40px 0; }
    .score-mega { font-size: 96px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-family: var(--font-mono); display: flex; align-items: flex-start; }
    .score-mega span { font-size: 48px; margin-top: 12px; color: var(--muted); }
    
    .status-badge {
      font-family: var(--font-mono); font-size: 14px; font-weight: 700; text-transform: uppercase;
      padding: 12px 16px; border: 2px solid var(--border); background: var(--pass-bg); color: var(--pass);
      display: inline-block; letter-spacing: 0.05em; margin-top: 16px; box-shadow: 4px 4px 0px rgba(0,0,0,1);
    }

    .btn-action-primary {
      font-family: var(--font-mono); font-size: 14px; font-weight: 700; text-transform: uppercase;
      background: var(--fg); color: var(--surface); border: 2px solid var(--border); padding: 16px 24px;
      cursor: pointer; box-shadow: 6px 6px 0px rgba(0,0,0,1); transition: all 0.1s; text-align: center;
      width: 100%; margin-top: auto;
    }
    .btn-action-primary:active { transform: translate(2px, 2px); box-shadow: 4px 4px 0px rgba(0,0,0,1); }

    .ledger-container { overflow-y: auto; background: var(--surface); display: flex; flex-direction: column; }
    .ledger-header { padding: 24px 32px; border-bottom: 2px solid var(--border); display: grid; grid-template-columns: 80px 1fr 140px; gap: 24px; font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--surface); z-index: 10; }
    
    .module-row { display: grid; grid-template-columns: 120px 1fr; border-bottom: 2px solid var(--border); }
    .module-row:last-child { border-bottom: none; }
    
    .module-photo { border-right: 2px solid var(--border); background-size: cover; background-position: center; filter: grayscale(100%); opacity: 0.8; }
    
    .module-content { padding: 24px 32px; display: grid; grid-template-columns: 1fr 120px; gap: 40px; align-items: center; }
    
    .module-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .module-badge { font-family: var(--font-mono); font-size: 11px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 0; font-weight: 600; }
    .badge-pass { background: var(--pass-bg); color: var(--pass); border-color: var(--pass); }
    .badge-fail { background: var(--fail-bg); color: var(--fail); border-color: var(--fail); }
    
    /* Brutalist Progress Bar */
    .bar-container { width: 100%; height: 16px; border: 2px solid var(--border); background: var(--bg); position: relative; }
    .bar-fill { height: 100%; background: var(--fg); position: absolute; left: 0; top: 0; }
    .bar-fill.warning { background: var(--fail); }
    
    .score-readout { font-family: var(--font-mono); font-size: 32px; font-weight: 800; text-align: right; }
    .score-metric { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; text-transform: uppercase; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const RESULTS = [
      { id: 'driving', num: '01', label: 'US Driving Behavior', score: 92, passing: 80, time: '04:12', status: 'pass', img: 'https://images.unsplash.com/photo-1449844908441-8829872d2607?auto=format&fit=crop&q=80&w=400' },
      { id: 'listening', num: '02', label: 'Listening Skills', score: 88, passing: 75, time: '07:44', status: 'pass', img: 'https://images.unsplash.com/photo-1516280440502-86ec168db6e5?auto=format&fit=crop&q=80&w=400' },
      { id: 'cognitive', num: '03', label: 'Cognitive Test', score: 96, passing: 85, time: '03:50', status: 'pass', img: 'https://images.unsplash.com/photo-1507413245164-6160d8298b31?auto=format&fit=crop&q=80&w=400' },
      { id: 'pattern', num: '04', label: 'Pattern Recognition', score: 100, passing: 90, time: '02:15', status: 'pass', img: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=400' },
      { id: 'grammar', num: '05', label: 'English & Grammar', score: 68, passing: 75, time: '04:00', status: 'fail', img: 'https://images.unsplash.com/photo-1455390582262-044cdead27d8?auto=format&fit=crop&q=80&w=400' }
    ];

    function Scoreboard() {
      // Calculate overall stats
      const totalScore = Math.round(RESULTS.reduce((acc, curr) => acc + curr.score, 0) / RESULTS.length);
      const passedModules = RESULTS.filter(r => r.status === 'pass').length;
      
      return (
        <div className="app-layout">
          <aside className="sidebar">
            <div className="sidebar-header">
              <span className="kicker">Zone Clearance / Finished</span>
              <h1>FINAL<br/>EVAL</h1>
            </div>
            
            <div className="candidate-info">
              <div className="data-row">
                <span className="data-label">Candidate</span>
                <span className="data-value">External_User_992</span>
              </div>
              <div className="data-row">
                <span className="data-label">Test ID</span>
                <span className="data-value mono">TRK-A84-91M</span>
              </div>
              <div className="data-row">
                <span className="data-label">Completion Time</span>
                <span className="data-value mono">22m 01s</span>
              </div>
              
              <div className="score-hero">
                <div className="data-label" style={{marginBottom: '12px'}}>Aggregate Score</div>
                <div className="score-mega">
                  {totalScore}<span>%</span>
                </div>
                
                {/* Global Status Decision */}
                <div className={`status-badge ${passedModules === 5 ? 'badge-pass' : 'badge-fail'}`} style={{ border: '2px solid', marginTop: '24px' }}>
                  {passedModules === 5 ? 'CLEARANCE APPROVED' : 'REQUIREMENTS NOT MET'}
                </div>
              </div>
              
              <button className="btn-action-primary" onClick={() => alert('Compiling Dossier PDF...')}>
                Export Dossier
              </button>
            </div>
          </aside>

          <main className="ledger-container">
            <div className="ledger-header">
              <div>Ref</div>
              <div>Telemetry Breakdown</div>
              <div style={{ textAlign: 'right' }}>Zone Score</div>
            </div>
            
            <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
              {RESULTS.map(mod => (
                <div key={mod.id} className="module-row">
                  <div className="module-photo" style={{ backgroundImage: `url(${mod.img})` }}></div>
                  <div className="module-content">
                    <div>
                      <div className="module-title">
                        {mod.label}
                        <span className={`module-badge ${mod.status === 'pass' ? 'badge-pass' : 'badge-fail'}`}>
                          {mod.status.toUpperCase()}
                        </span>
                      </div>
                      
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 60px', gap: '16px', alignItems: 'center' }}>
                        <div className="bar-container">
                          <div className={`bar-fill ${mod.status === 'fail' ? 'warning' : ''}`} style={{ width: `${mod.score}%` }}></div>
                          {/* Passing Threshold Marker */}
                          <div style={{ position: 'absolute', left: `${mod.passing}%`, top: '-4px', bottom: '-4px', width: '2px', background: 'var(--muted)', zIndex: 2 }}></div>
                        </div>
                        <div className="data-label" style={{ fontSize: '10px', textAlign: 'right' }}>
                          REQ: {mod.passing}
                        </div>
                      </div>
                    </div>
                    
                    <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                      <div className="score-readout">{mod.score}</div>
                      <div className="score-metric">Time: {mod.time}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Scoreboard />);
  </script>
</body>
</html>
