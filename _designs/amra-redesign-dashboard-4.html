
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMRA Assessment Dashboard</title>
  
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  
  <style>
    :root {
      /* Neo-brutalist / Tactile Light */
      --bg: #f4f4f0;
      --surface: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --border: #111111;
      --accent: #0055ff;
      --accent-hover: #0044cc;
      
      --font-display: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
      padding: 32px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-layout {
      width: 100%;
      max-width: 1440px;
      height: calc(100vh - 64px);
      display: grid;
      grid-template-columns: 380px 1fr;
      background: var(--surface);
      border: 2px solid var(--border);
      box-shadow: 12px 12px 0px rgba(0,0,0,1);
    }

    /* Left Sidebar: Hero & Status */
    .sidebar {
      border-right: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      background: #f9f9f9;
    }

    .sidebar-header {
      padding: 40px 32px;
      border-bottom: 2px solid var(--border);
    }

    .kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      display: block;
      margin-bottom: 24px;
    }

    .sidebar-header h1 {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .candidate-info {
      padding: 32px;
      flex: 1;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    .data-label {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .data-value {
      font-weight: 600;
      font-size: 14px;
    }

    .punch-card {
      margin-top: 40px;
    }
    
    .punch-card-title {
      font-family: var(--font-mono);
      font-size: 12px;
      margin-bottom: 12px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .punch-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .punch-slot {
      aspect-ratio: 1;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      background: var(--surface);
    }
    
    .punch-slot.done {
      background: var(--fg);
      color: var(--surface);
    }

    /* Right Main: Ledger List */
    .ledger-container {
      overflow-y: auto;
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }

    .ledger-header {
      padding: 24px 32px;
      border-bottom: 2px solid var(--border);
      display: grid;
      grid-template-columns: 80px 1fr 140px;
      gap: 24px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 10;
    }

    .module-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      border-bottom: 2px solid var(--border);
      cursor: pointer;
      position: relative;
    }
    
    .module-row:last-child {
      border-bottom: none;
    }
    
    .module-row:hover .module-content {
      background: #fafafa;
    }
    
    .module-photo {
      border-right: 2px solid var(--border);
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) contrast(120%);
      transition: filter 0.3s;
    }
    
    .module-row:hover .module-photo {
      filter: grayscale(0%) contrast(100%);
    }

    .module-content {
      padding: 24px 32px;
      display: grid;
      grid-template-columns: 1fr 140px;
      gap: 24px;
      align-items: center;
      transition: background 0.2s;
    }

    .module-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .module-desc {
      font-size: 15px;
      color: var(--muted);
      max-width: 500px;
    }

    .btn-action {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--surface);
      border: 2px solid var(--border);
      padding: 12px 16px;
      cursor: pointer;
      box-shadow: 4px 4px 0px rgba(0,0,0,1);
      transition: all 0.1s;
      text-align: center;
    }

    .module-row:hover .btn-action {
      background: var(--accent);
      color: var(--surface);
      border-color: var(--accent);
    }
    
    .btn-action:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px rgba(0,0,0,1);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const MODULES = [
      {
        id: 'driving', num: '01', label: 'US Driving Behavior', time: '05 Min',
        desc: '3D spatial reasoning, occlusion awareness across AZ, CA, NY simulated scenarios.',
        img: 'https://images.unsplash.com/photo-1449844908441-8829872d2607?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'listening', num: '02', label: 'Listening Skills', time: '08 Min',
        desc: 'Audio-based fraud comprehension and strict agent procedure retention analysis.',
        img: 'https://images.unsplash.com/photo-1516280440502-86ec168db6e5?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'cognitive', num: '03', label: 'Cognitive Test', time: '05 Min',
        desc: 'Situational judgment and rapid logic verification under stress conditions.',
        img: 'https://images.unsplash.com/photo-1507413245164-6160d8298b31?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'pattern', num: '04', label: 'Pattern Recognition', time: '04 Min',
        desc: 'Visual sequence reconstruction under extreme time logic constraints.',
        img: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=400'
      },
      {
        id: 'grammar', num: '05', label: 'English & Grammar', time: '04 Min',
        desc: 'Standardized tactical sentence structuring and communication accuracy.',
        img: 'https://images.unsplash.com/photo-1455390582262-044cdead27d8?auto=format&fit=crop&q=80&w=400'
      }
    ];

    function Dashboard() {
      // Hardcoding completions empty for the prototype view
      const completions = {}; 

      return (
        <div className="app-layout">
          
          <aside className="sidebar">
            <div className="sidebar-header">
              <span className="kicker">System // Auth</span>
              <h1>AMRA<br/>INTEL</h1>
            </div>
            
            <div className="candidate-info">
              <div className="data-row">
                <span className="data-label">Candidate</span>
                <span className="data-value">External_User_992</span>
              </div>
              <div className="data-row">
                <span className="data-label">Test ID</span>
                <span className="data-value" style={{fontFamily: 'var(--font-mono)'}}>TRK-A84-91M</span>
              </div>
              <div className="data-row">
                <span className="data-label">Status</span>
                <span className="data-value">Pending Execution</span>
              </div>
              
              <div className="punch-card">
                <div className="punch-card-title">Zone Clearance (0/5)</div>
                <div className="punch-grid">
                  {MODULES.map(mod => (
                    <div key={mod.id} className={`punch-slot ${completions[mod.id] ? 'done' : ''}`}>
                      {mod.num}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </aside>

          <main className="ledger-container">
            <div className="ledger-header">
              <div>Ref</div>
              <div>Assessment Details</div>
              <div style={{ textAlign: 'right' }}>Action</div>
            </div>
            
            <div style={{ display: 'flex', flexDirection: 'column', flex: 1 }}>
              {MODULES.map(mod => (
                <div key={mod.id} className="module-row" onClick={() => window.location.href = `zone-${mod.id}.html`}>
                  <div className="module-photo" style={{ backgroundImage: `url(${mod.img})` }}></div>
                  <div className="module-content">
                    <div>
                      <div style={{ fontFamily: 'var(--font-mono)', fontSize: '11px', color: 'var(--muted)', marginBottom: '8px' }}>
                        TIME LIMIT: {mod.time}
                      </div>
                      <h2 className="module-title">{mod.label}</h2>
                      <p className="module-desc">{mod.desc}</p>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <button className="btn-action">Execute</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </main>
          
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
