
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMRA Simulator - Dashboard</title>
  
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg: #030712;
      --surface: rgba(17, 24, 39, 0.7);
      --surface-hover: rgba(31, 41, 55, 0.9);
      --fg: #f9fafb;
      --muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.1);
      
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.3);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.3);
      
      --font-display: 'Inter', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
      background-image: 
        radial-gradient(ellipse at top, var(--accent-glow) 0%, transparent 40%),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      min-height: 100vh;
    }

    .app-container { max-width: 1200px; margin: 0 auto; padding: 64px 24px; }

    .header-panel {
      display: flex; justify-content: space-between; align-items: stretch;
      background: var(--surface); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 24px;
      padding: 40px; margin-bottom: 48px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .title-area h1 { font-size: 40px; font-weight: 900; letter-spacing: -0.04em; margin: 12px 0; }
    .kicker { font-family: var(--font-mono); font-size: 13px; color: var(--accent); text-transform: uppercase; font-weight: 700; letter-spacing: 0.1em; display: inline-flex; align-items: center; gap: 8px;}
    
    .stats-ring {
      position: relative; width: 120px; height: 120px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.4); border-radius: 50%;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    
    .stats-ring::before {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      background: conic-gradient(var(--accent) 40%, transparent 40%);
      -webkit-mask: radial-gradient(transparent 56px, black 57px);
      mask: radial-gradient(transparent 56px, black 57px);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .stats-value { font-size: 32px; font-weight: 800; font-family: var(--font-mono); }
    .stats-total { font-size: 16px; color: var(--muted); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }

    .module-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px; position: relative;
      overflow: hidden; cursor: pointer; transition: all 0.3s;
      backdrop-filter: blur(10px);
    }

    .module-card:hover {
      background: var(--surface-hover); transform: translateY(-4px);
      border-color: rgba(255,255,255,0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow);
    }
    
    /* Simulate Gamified Image Graphics without needing external assets */
    .module-graphic {
      height: 120px; border-radius: 12px; margin-bottom: 24px;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    
    .module-graphic i { font-size: 64px; color: rgba(255,255,255,0.9); z-index: 2; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5)); }

    .bg-driving { background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
    .bg-listening { background: linear-gradient(135deg, #581c87, #a855f7); }
    .bg-cognitive { background: linear-gradient(135deg, #064e3b, #10b981); }
    .bg-pattern { background: linear-gradient(135deg, #7c2d12, #f97316); }
    .bg-grammar { background: linear-gradient(135deg, #374151, #6b7280); }

    .module-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .module-desc { color: var(--muted); font-size: 14px; margin-bottom: 20px; min-height: 42px; }
    
    .skills-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .skill-tag {
      background: rgba(0,0,0,0.5); border: 1px solid var(--border);
      padding: 4px 10px; border-radius: 999px; font-size: 11px;
      font-weight: 600; text-transform: uppercase; color: var(--muted);
      font-family: var(--font-mono);
    }
    
    .time-stamp {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
      padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn-play {
      position: absolute; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; z-index: 3;
    }
    .module-graphic:hover .btn-play { opacity: 1; }
    .btn-play i { font-size: 48px; color: #fff; text-shadow: 0 0 20px var(--accent); }
    
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const MODULES = [
      {
        id: 'driving', label: 'US Driving Behavior', time: '05:00',
        desc: '3D spatial reasoning, occlusion awareness across complex AZ, CA, NY scenarios.',
        bg: 'bg-driving', icon: 'ph-car-profile', skills: ['spatial', 'prediction']
      },
      {
        id: 'listening', label: 'Listening Skills', time: '08:00',
        desc: 'Audio-based fraud comprehension and strict agent procedure retention.',
        bg: 'bg-listening', icon: 'ph-headphones', skills: ['retention', 'procedural']
      },
      {
        id: 'cognitive', label: 'Cognitive Test', time: '05:00',
        desc: 'Simulated situational judgment and rapid fraud pattern recognition.',
        bg: 'bg-cognitive', icon: 'ph-brain', skills: ['attention', 'situational']
      },
      {
        id: 'pattern', label: 'Pattern Recognition', time: '04:00',
        desc: 'Visual sequence memory under extreme time pressure constraints.',
        bg: 'bg-pattern', icon: 'ph-shapes', skills: ['memory', 'rapid_recall']
      },
      {
        id: 'grammar', label: 'English & Grammar', time: '04:00',
        desc: 'Standardized sentence structure and communication accuracy.',
        bg: 'bg-grammar', icon: 'ph-pencil-line', skills: ['grammar', 'communication']
      }
    ];

    function App() {
      // In a real Vite app, this uses React Router and Zustand
      return (
        <div className="app-container">
          <header className="header-panel">
            <div className="title-area">
              <div className="kicker">
                <i className="ph-fill ph-radar"></i> AMRA SYS-ON
              </div>
              <h1>Evaluation Sandbox</h1>
              <p style={{ color: 'var(--muted)', fontSize: 16 }}>Simulator ready. Select a module to begin evaluation.</p>
            </div>
            
            <div style={{ display: 'flex', alignItems: 'center', gap: 24 }}>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 14, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Sim Status</div>
                <div style={{ color: 'var(--success)', fontWeight: 700, fontSize: 18, textShadow: '0 0 10px var(--success-glow)' }}>ONLINE</div>
              </div>
              <div className="stats-ring">
                <div style={{ textAlign: 'center' }}>
                  <span className="stats-value">2</span><span className="stats-total">/5</span>
                </div>
              </div>
            </div>
          </header>

          <div className="grid">
            {MODULES.map(mod => (
              <div key={mod.id} className="module-card">
                <div className={`module-graphic ${mod.bg}`}>
                  <div className="time-stamp">{mod.time}</div>
                  <i className={`ph-fill ${mod.icon}`}></i>
                  <div className="btn-play">
                    <i className="ph-fill ph-play-circle"></i>
                  </div>
                </div>
                
                <h3 className="module-title">{mod.label}</h3>
                <p className="module-desc">{mod.desc}</p>
                
                <div className="skills-row">
                  {mod.skills.map(s => <span key={s} className="skill-tag">{s}</span>)}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }
    
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
