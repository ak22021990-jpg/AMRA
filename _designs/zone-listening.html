<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMRA Simulator - Listening</title>
  <style>
    :root {
      --bg: #f4f4f0; --surface: #ffffff; --fg: #111111; --muted: #666666;
      --border: #111111; --accent: #0055ff;
      --font-body: "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font-body); display: flex; height: 100vh; padding: 32px; align-items: center; justify-content: center; }
    .layout {
      width: 100%; max-width: 1000px; height: calc(100vh - 64px);
      display: grid; grid-template-rows: auto auto 1fr auto; background: var(--surface);
      border: 2px solid var(--border); box-shadow: 12px 12px 0px rgba(0,0,0,1);
    }
    .header { padding: 24px 32px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .header-title { font-family: var(--font-mono); font-size: 14px; text-transform: uppercase; font-weight: 700; display: flex; gap: 16px; }
    .timer { font-family: var(--font-mono); font-size: 24px; font-weight: 700; }
    .waveform-panel { background: #f9f9f9; border-bottom: 2px solid var(--border); padding: 40px; display: flex; flex-direction: column; align-items: center; }
    .waveform-visualizer { width: 100%; height: 80px; display: flex; align-items: center; gap: 4px; overflow: hidden; margin-bottom: 24px; }
    .bar { flex: 1; background: var(--border); height: 10%; border-radius: 2px; }
    .bar:nth-child(even) { height: 60%; background: var(--accent); }
    .bar:nth-child(3n) { height: 90%; }
    .bar:nth-child(5n) { height: 30%; }
    .player-controls { display: flex; gap: 16px; }
    .btn-icon { width: 48px; height: 48px; border: 2px solid var(--border); background: var(--surface); font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 4px 4px 0px rgba(0,0,0,1); }
    .btn-icon:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px rgba(0,0,0,1); }
    .q-area { padding: 40px; }
    .q-label { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; }
    h2 { font-size: 24px; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.02em; }
    .options { display: grid; gap: 12px; }
    .option { padding: 16px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; font-size: 15px; font-weight: 600; display: flex; gap: 16px; box-shadow: 4px 4px 0px rgba(0,0,0,1); }
    .option:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0px rgba(0,0,0,1); }
    .footer { padding: 24px 40px; border-top: 2px solid var(--border); display: flex; justify-content: space-between; background: #f9f9f9; }
    .btn { font-family: var(--font-mono); font-size: 13px; font-weight: 700; padding: 12px 24px; text-transform: uppercase; border: 2px solid var(--border); cursor: pointer; background: var(--surface); box-shadow: 4px 4px 0px rgba(0,0,0,1); }
    .btn-primary { background: var(--accent); color: white; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="header">
      <div class="header-title"><span>ZONE 02</span> <span>//</span> <span>Listening Skills</span></div>
      <div class="timer">01:45</div>
    </div>
    <div class="waveform-panel">
      <div class="waveform-visualizer">
        <!-- Pseudo waveform -->
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      </div>
      <div class="player-controls">
        <button class="btn-icon">↺</button>
        <button class="btn-icon" style="background: var(--fg); color: white;">▶</button>
      </div>
    </div>
    <div class="q-area">
      <div class="q-label">Audio Case 3 / 10</div>
      <h2>Based on the recorded interaction, which mandatory disclosure did the agent fail to provide?</h2>
      <div class="options">
        <div class="option"><span>A</span> <span>The 14-day cancellation window</span></div>
        <div class="option"><span>B</span> <span>The recurring monthly charge amount</span></div>
        <div class="option"><span>C</span> <span>Opt-out instructions for marketing calls</span></div>
        <div class="option"><span>D</span> <span>The agent provided all disclosures</span></div>
      </div>
    </div>
    <div class="footer">
      <button class="btn" onclick="window.location.href='amra-redesign-dashboard.html'">ABORT</button>
      <button class="btn btn-primary" onclick="window.location.href='zone-cognitive.html'">SUBMIT</button>
    </div>
  </div>
</body>
</html>
